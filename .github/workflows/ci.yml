name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the installers can be built for a release without waiting for a push to main.
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the run in flight pointless: nothing is learnt from
# finishing a check on a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Left to itself, electron-builder looks for a signing certificate on the machine it is
  # running on and uses whatever it finds. Nothing this project builds is signed, and a
  # build machine is the last place that should become the exception.
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  check:
    name: Check (${{ matrix.os }})
    # The filesystem layer behaves differently per platform: symbolic links need a privilege
    # Windows does not grant by default, and path casing differs. Run everywhere.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

  package:
    name: Package (${{ matrix.os }})
    # Packaging is where a bundling mistake, a capability left switched on, or a file that
    # should never have shipped actually shows up. The application is assembled on every
    # platform it is meant to run on and then read back rather than assumed; installers are
    # left to the job below, which does not have to run for every review.
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run package:dir

      - run: pnpm run verify:package

  installers:
    name: Installers (${{ matrix.os }})
    # The disk image, the Windows installer and the AppImage, each built on its own platform:
    # the helper programs that produce them are platform binaries and cannot all be run from
    # one machine. The verified Windows installer is retained as a workflow artifact so it
    # can be downloaded for a manual release; nothing is published as a GitHub release.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run package

      - run: pnpm run verify:package

      - name: Retain Windows installer for manual release
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: VitaTheme-Windows-x64-Setup
          path: release/VitaTheme-*-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
