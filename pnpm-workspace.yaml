# Package build scripts are opt-in. esbuild ships a platform-specific binary that Vitest
# needs. Electron 42+ has no postinstall script; our dev/start commands call its
# install-electron CLI to download the desktop runtime when it is missing.
#
# `electron-winstaller` arrives with electron-builder and fetches Squirrel.Windows, an
# installer format this project does not use — VitaTheme builds an NSIS installer instead.
# Its install script is deliberately not run.
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: false
